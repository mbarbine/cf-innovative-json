openapi: 3.1.0
info:
  title: json API
  version: 1.0.0
  description: JSON tooling API and discovery surface for json.
servers:
  - url: https://json.platphormnews.com
components:
  securitySchemes:
    PlatPhormApiKey:
      type: http
      scheme: bearer
      description: >
        Use Authorization: Bearer $PLATPHORM_API_KEY or X-PlatPhorm-API-Key for
        protected actions.
    PlatPhormHeader:
      type: apiKey
      in: header
      name: X-PlatPhorm-API-Key
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health
  /api/v1/health:
    get:
      summary: Health check v1
      responses:
        '200':
          description: Service health
  /api/docs:
    get:
      summary: OpenAPI specification
      responses:
        '200':
          description: OpenAPI specification
